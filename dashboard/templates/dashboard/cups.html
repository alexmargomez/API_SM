{% extends 'dashboard/base.html' %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <h2 class="mb-0 fs-3"><i class="fas fa-syringe text-warning me-2"></i> Gestión de CUPS</h2>
    <div class="d-flex gap-2 d-none d-md-flex">
        <a href="{% url 'export_csv' 'cups' %}" class="btn btn-export w-100 w-md-auto"><i class="fas fa-file-csv me-2"></i>Exportar CSV</a>
    </div>
</div>

<div class="mb-4">
    <form method="get" class="d-flex align-items-center">
        <div class="input-group input-group-lg w-100 position-relative shadow-sm rounded-pill bg-white" style="border: 1px solid rgba(0,0,0,0.05); transition: all 0.3s ease;">
            <span class="input-group-text bg-transparent border-0 text-primary px-4" style="z-index: 10;">
                <i class="fas fa-search"></i>
            </span>
            <input type="text" name="q" class="form-control border-0 bg-transparent py-3 ps-0" placeholder="Buscar por código o descripción..." value="{{ q }}" style="box-shadow: none; font-size: 1.1rem; outline: none;">
            <button type="button" class="btn border-0 bg-transparent text-muted px-4" id="clear-search" style="z-index: 10; display: {% if q %}block{% else %}none{% endif %};" title="Limpiar búsqueda">
                <i class="fas fa-times-circle fs-5 opacity-75"></i>
            </button>
        </div>
    </form>
</div>

<div class="glass-card">
    <div id="table-container">
        {% include "dashboard/partials/cups_table.html" %}
    </div>
</div>

<div class="d-block d-md-none mt-4 mb-3">
    <a href="{% url 'export_csv' 'cups' %}" class="btn btn-export w-100 py-3 shadow-sm" style="font-size: 1.1rem;"><i class="fas fa-file-csv me-2"></i>Exportar CSV</a>
</div>
{% endblock %}
