<div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
    <small class="text-muted fw-bold">
        <i class="fas fa-database me-1"></i>
        Total en base de datos: {{ total }}
    </small>

    <nav aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
            {% if page_obj.has_previous %}
                <li class="page-item">
                    <button class="page-link ajax-page-btn" data-page="1" aria-label="Primero">
                        <span aria-hidden="true">&laquo;&laquo;</span>
                    </button>
                </li>
                <li class="page-item">
                    <button class="page-link ajax-page-btn" data-page="{{ page_obj.previous_page_number }}" aria-label="Anterior">
                        <span aria-hidden="true">&laquo;</span>
                    </button>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">&laquo;&laquo;</span></li>
                <li class="page-item disabled"><span class="page-link">&laquo;</span></li>
            {% endif %}

            <li class="page-item disabled">
                <span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
            </li>

            {% if page_obj.has_next %}
                <li class="page-item">
                    <button class="page-link ajax-page-btn" data-page="{{ page_obj.next_page_number }}" aria-label="Siguiente">
                        <span aria-hidden="true">&raquo;</span>
                    </button>
                </li>
                <li class="page-item">
                    <button class="page-link ajax-page-btn" data-page="{{ page_obj.paginator.num_pages }}" aria-label="Último">
                        <span aria-hidden="true">&raquo;&raquo;</span>
                    </button>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">&raquo;</span></li>
                <li class="page-item disabled"><span class="page-link">&raquo;&raquo;</span></li>
            {% endif %}
        </ul>
    </nav>
</div>
