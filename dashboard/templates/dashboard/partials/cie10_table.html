<div class="table-responsive border-0">
    <table class="table table-hover mb-0">
        <thead>
            <tr>
                <th class="text-nowrap">Código</th>
                <th class="text-nowrap">Descripción</th>
                <th class="text-nowrap">Versión</th>
                <th class="text-nowrap">Fecha Versión</th>
            </tr>
        </thead>
        <tbody>
            {% for cie in page_obj %}
            <tr>
                <td><span class="badge bg-success">{{ cie.codigo }}</span></td>
                <td>{{ cie.descripcion }}</td>
                <td>{{ cie.version }}</td>
                <td><span class="badge bg-light text-dark">{{ cie.version_fecha|default:"-" }}</span></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center py-4 text-muted">No hay registros disponibles</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% include "dashboard/partials/pagination.html" %}
