<div class="table-responsive border-0">
    <table class="table table-hover mb-0">
        <thead>
            <tr>
                <th class="text-nowrap">Código</th>
                <th class="text-nowrap">Nombre EPS</th>
                <th class="text-nowrap">NIT</th>
                <th class="text-nowrap">Régimen</th>
            </tr>
        </thead>
        <tbody>
            {% for eps in page_obj %}
            <tr>
                <td><span class="badge bg-primary">{{ eps.codigo }}</span></td>
                <td class="fw-bold">{{ eps.nombre }}</td>
                <td>{{ eps.nit }}</td>
                <td><span class="badge bg-light text-dark">{{ eps.regimen }}</span></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center py-4 text-muted">No hay registros disponibles</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% include "dashboard/partials/pagination.html" %}
