services:
  db:
    image: mariadb:11
    container_name: api_sm_mysql
    restart: unless-stopped
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --max-connections=60
      --table-open-cache=400
      --skip-name-resolve=ON
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: api_sm_django
    restart: unless-stopped
    command: >
      sh -c "sleep 15 && python manage.py makemigrations && python manage.py migrate && gunicorn --bind 0.0.0.0:8000 core.wsgi:application"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  mysql_data:
